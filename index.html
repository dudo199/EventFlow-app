// ---- GitHub backup (token kept on this device only, never inside the backup) ----
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem('evtgh')||'{}')}catch(e){return{}}};
const ghOk=()=>{const c=ghCfg();return !!(c.o&&c.r&&c.t)};
const ghHash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
const ghH=c=>({Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'});
const ghU=(c,path)=>'https://api.github.com/repos/'+encodeURIComponent(c.o)+'/'+encodeURIComponent(c.r)+(path||'');
const ghPath='evtapp-backup.json';
function ghMsg(m,bad){V.ghm={m,bad:!!bad};if(V.pop&&V.pop.k=='bk'){const e=document.getElementById('ghm');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':'var(--ok)'}}}
async function ghSaveCfg(){const o=document.getElementById('gho').value.trim(),r=document.getElementById('ghr').value.trim().replace(/^.*\//,''),t=document.getElementById('ght').value.trim()||ghCfg().t||'';
if(!o||!r||!t){ghMsg('Fill in your GitHub user, repository and token.',true);return}
const c={o,r,t};ghMsg('Checking…');
try{const x=await fetch(ghU(c),{headers:ghH(c)});if(x.status==401||x.status==403){ghMsg('GitHub refused that token.',true);return}if(x.status==404){ghMsg('Repository not found, or the token does not cover it.',true);return}
const d=await x.json();if(d.private===false){ghMsg('That repository is public. Your business data would be visible to everyone. Make it private first.',true);return}
c.last=0;localStorage.setItem('evtgh',JSON.stringify(c));ghMsg('Saved. Backing up…');render();await ghPush(true);render()}catch(e){ghMsg('Could not reach GitHub ('+e.message+').',true)}}
const ghB64=async b=>{const u=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function ghSha(c,path){const g=await fetch(ghU(c,'/contents/'+path),{headers:ghH(c)});if(g.ok)return (await g.json()).sha;if(g.status==404)return null;throw new Error('read '+g.status)}
async function ghPut(c,path,b64,msg){const sha=await ghSha(c,path)||undefined;
const r=await fetch(ghU(c,'/contents/'+path),{method:'PUT',headers:{...ghH(c),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64,sha})});if(!r.ok)throw new Error('write '+r.status);try{return (await r.json()).content.sha}catch(e){return null}}
const ghSet=f=>{const c=ghCfg();f(c);localStorage.setItem('evtgh',JSON.stringify(c))};
const pdfKeys=()=>{const k=[];S.jobs.forEach(j=>['quote','invoice'].forEach(x=>{if(j.docs&&j.docs[x]&&j.docs[x].pdf)k.push(j.id+':'+x)}));return k};
async function ghPdfSync(){const c=ghCfg();c.p=c.p||{};let n=0;
for(const k of pdfKeys()){const b=await idbGet(k).catch(()=>null);if(!b)continue;const sig=b.size+':'+(b.lastModified||0);if(c.p[k]===sig)continue;
await ghPut(c,'pdfs/'+k.replace(':','-')+'.pdf',await ghB64(b),'PDF '+k);c.p[k]=sig;n++;const cc=ghCfg();cc.p=c.p;localStorage.setItem('evtgh',JSON.stringify(cc))}return n}
async function ghPush(manual,force){const c=ghCfg();if(!c.t)return false;if(c.hold&&!force)return false;const body=JSON.stringify(S),h=ghHash(body);
try{if(force||manual||c.h!=h){const rs=await ghSha(c,ghPath);
if(rs&&!force&&rs!==c.rs){ghSet(x=>{x.hold=1});render();ghMsg(c.rs?'Another device saved a newer backup. Backups are paused so nothing gets overwritten. Press Load latest, then Restore, to get it.':'This repository already has a backup. Press Load latest, then Restore, to use it. Backups are paused until then.',true);return false}
const b64=btoa(unescape(encodeURIComponent(body)));const ns=await ghPut(c,ghPath,b64,'Backup '+new Date().toISOString());ghSet(x=>{x.h=h;x.rs=ns||rs;delete x.hold})}
const wasHold=!!c.hold;const np=await ghPdfSync();ghSet(x=>{delete x.err;delete x.hold;x.last=Date.now()});if(wasHold)render();const c2=ghCfg();
ghMsg('Backed up to GitHub '+new Date(c2.last).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+(np?' ('+np+' PDF'+(np>1?'s':'')+' too)':'')+'.');return true}
catch(e){ghSet(x=>{x.err=String(e.message||e)});ghMsg('Backup failed ('+e.message+'). It will retry.',true);return false}}
async function ghRestorePdfs(){const c=ghCfg();if(!c.t)return 0;let n=0;
try{for(const k of pdfKeys()){if(await idbGet(k).catch(()=>null))continue;
const r=await fetch(ghU(c,'/contents/pdfs/'+k.replace(':','-')+'.pdf'),{headers:{...ghH(c),Accept:'application/vnd.github.raw+json'}});if(!r.ok)continue;
await idbPut(k,new Blob([await r.arrayBuffer()],{type:'application/pdf'}));n++}}catch(e){}
if(n)ghMsg('Restored '+n+' PDF'+(n>1?'s':'')+' from GitHub.');return n}
async function ghRestore(){const c=ghCfg();if(!c.t){ghMsg('Set up GitHub backup first.',true);return}
try{const r=await fetch(ghU(c,'/contents/'+ghPath),{headers:{...ghH(c),Accept:'application/vnd.github.raw+json'}});if(!r.ok)throw new Error(r.status==404?'no backup in the repository yet':'read '+r.status);
const sh=await ghSha(c,ghPath);ghSet(x=>{x.pend=sh});document.getElementById('bki').value=await r.text();ghMsg('Backup loaded below. Press Restore to apply it (PDFs come back with it).')}catch(e){ghMsg('Could not load ('+e.message+').',true)}}
function ghOff(){localStorage.removeItem('evtgh');V.ghm=null;render()}

const TD=()=>S.todos||(S.todos=[]);
const tdSort=(a,b)=>(a.done-b.done)||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0)||(a.id-b.id);
const tdDue=t=>{if(!t.due)return'';const d=dBetween(today(),t.due);return d<0?Math.abs(d)+' day'+(d==-1?'':'s')+' overdue':d==0?'Today':d==1?'Tomorrow':dNice(t.due)};
function tdTog(id){const t=TD().find(x=>x.id==id);if(!t)return;t.done=!t.done;t.dDate=t.done?today():undefined;render()}
function todoList(l,jid,showJob){if(!l.length)return jid?'':`<div class="card"><div class="mu">Nothing here.</div></div>`;
return`<div class="card grp">${l.slice().sort(tdSort).map(t=>{const j=t.j?J(t.j):null,od=!t.done&&t.due&&t.due<today();return`<div class="sw"><div class="swa"><button class="d" onclick="askDel('td',${t.id})">Delete</button></div><div class="card tdr ${t.done?'dn':''} ${od?'od':''}" onclick="swTapE('tdedit',${t.id})"><button class="ck" aria-label="${t.done?'Mark not done':'Mark done'}" onclick="event.stopPropagation();tdTog(${t.id})">${t.done?'✓':''}</button><span style="flex:1;min-width:0"><div class="tt">${esc(t.text)}</div>${(()=>{const x=[showJob&&j?`<a href="#" style="color:inherit" onclick="event.preventDefault();event.stopPropagation();go('jobs',${j.id})">${esc(jt(j))}</a>`:'',t.due?`<span class="du">${tdDue(t)}</span>`:'',t.done&&t.dDate?'done '+dNice(t.dDate):''].filter(Boolean);return x.length?`<div class="mu">${x.join(' · ')}</div>`:''})()}</span></div></div>`}).join('')}</div>`+(jid?tdAddBtn(jid):'')}
const tdAddBtn=jid=>'';
function todoView(){const all=TD(),open=all.filter(t=>!t.done),done=all.filter(t=>t.done).sort((a,b)=>(b.dDate||'')<(a.dDate||'')?-1:1);
const od=open.filter(t=>t.due&&t.due<today()),tdy=open.filter(t=>t.due&&t.due>=today()&&t.due<=hd(7)&&!od.includes(t)),later=open.filter(t=>!od.includes(t)&&!tdy.includes(t));
const sec=(h,l)=>l.length?`<h2>${h}</h2>${todoList(l,0,true)}`:'';
return`<h1>To-do list</h1>`+quickAdd('qd','Add a to-do…','qaTodo',"V.pop={k:'tdnew',j:0};render()")+(open.length?sec('Overdue',od)+sec('This week',tdy)+sec(od.length||tdy.length?'Later':'Open',later):'<div class="card"><div class="mu">Nothing to do. Add one with the + button, or from a job page.</div></div>')
+(done.length?`<details class="fd" ${V.tdd?'open':''} ontoggle="V.tdd=this.open"><summary>Done (${done.length})</summary>${todoList(done.slice(0,30),0,true)}${done.length>5?`<div style="text-align:center"><button style="font-size:12px;opacity:.6;border:0;background:none;color:var(--tx)" onclick="askDel('tdclear')">Clear done to-dos</button></div>`:''}</details>`:'')
}
function tdSheet(top){const o=V.pop,t=o.k=='tdedit'?TD().find(x=>x.id==o.id):null;if(o.k=='tdedit'&&!t){V.pop=null;return''}
const jobs=S.jobs.slice().sort((a,b)=>a.date<b.date?1:-1),cur=t?t.j:o.j;
return top(t?'Edit to-do':'New to-do')+`<div class="f"><div style="grid-column:1/-1"><label>What</label><input id="tdt" value="${esc(t?t.text:'')}" placeholder="e.g. Confirm generator with supplier" onkeydown="if(event.key=='Enter'){event.preventDefault();tdSave()}"></div>
<div><label>Due (optional)</label><input id="tdd" type="date" value="${t&&t.due?t.due:''}"></div>
<div><label>Job (optional)</label><select id="tdj"><option value="0">No job</option>${jobs.map(j=>`<option value="${j.id}" ${cur==j.id?'selected':''}>${esc(jt(j))} · ${dNice(j.date)}</option>`).join('')}</select></div>
<div style="grid-column:1/-1;display:flex;gap:6px">${t?`<button class="x" title="Delete" onclick="askDel('td',${t.id})">✕</button>`:''}<button class="p" style="flex:1" onclick="tdSave()">${t?'Save':'Add to-do'}</button></div></div></div>`}
function tdSave(){const o=V.pop,txt=document.getElementById('tdt').value.trim();if(!txt){document.getElementById('tdt').focus();return}
const due=document.getElementById('tdd').value||undefined,j=+document.getElementById('tdj').value||undefined;
if(o.k=='tdedit'){const t=TD().find(x=>x.id==o.id);t.text=txt;t.due=due;t.j=j}else TD().push({id:nid(TD()),text:txt,due,j,done:false,made:today()});
V.pop=null;render()}

render();
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
